{% extends "faceapp/base.html" %} {%block title %}사용자 등록{%endblock title %}
{%block content %}
<h1>사용자 등록</h1>

<form method="POST" enctype="multipart/form-data">
  {% csrf_token %} {{ form.as_p }}
  <button type="submit" name="start_webcam" value="false">
    사진으로 등록하기
  </button>
  <button type="submit" name="start_webcam" value="true">
    영상으로 등록하기
  </button>
</form>
{%endblock content%}
